# SecureWatch configuration file

# Paths are based on the securewatch project folder.
# Command-line options (-f, -t, -n) can change these settings.

# Default log file to analyze
LOG_FILE="sample_logs/auth_sample.log"

# Number of failed attempts from one IP that triggers a brute-force alert
FAIL_THRESHOLD=5

# Detect successful logins during the selected odd hours.
# Use hours from 0 to 23.
# If the start hour is greater than the end hour (e.g. 22 and 6),
# the time range continues after midnight.
ODD_HOUR_START=0
ODD_HOUR_END=5

# Folder where security reports are saved
REPORT_DIR="reports"

# Number of rows shown in "top" tables
TOP_LIMIT=5

# Terminal colors: auto, yes or no
USE_COLOR="auto"
